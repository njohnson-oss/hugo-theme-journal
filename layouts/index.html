{{ define "main" -}}
<main>
  <h1>{{ .Site.Params.indexTitle }}</h1>
  <p>{{ .Site.Params.indexIntro }}</p>
  <h2>Navigation Links</h2>
  <nav>
    <ul>
    {{- range .Site.Menus.main }}
    <li class="navlink"><a href="{{ .URL }}" rel="noreferrer">🔗 {{ .Name }}</a></li>
    {{- end }}
    </ul>
  </nav>
  <h2>Journal Entries</h2>
  {{ partial "metadata.html" . -}}
</main>
{{- end }}
